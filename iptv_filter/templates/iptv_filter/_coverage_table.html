<div class="table-responsive" style="max-height: 360px; overflow-y: auto;">
    <table class="table table-sm table-striped mb-0">
        <thead><tr><th>Channel</th><th>Group</th><th>tvg-id</th>{% if show_epg %}<th>EPG id</th>{% endif %}</tr></thead>
        <tbody>
        {% for r in rows %}
            <tr><td>{{ r.name }}</td><td>{{ r.group }}</td><td><code>{{ r.tvg_id }}</code></td>{% if show_epg %}<td><code>{{ r.epg_id }}</code></td>{% endif %}</tr>
        {% endfor %}
        </tbody>
    </table>
</div>
